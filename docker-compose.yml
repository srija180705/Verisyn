services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fraud-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraud_app
      POSTGRES_PASSWORD: fraud_app
      POSTGRES_DB: fraud_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_app -d fraud_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
